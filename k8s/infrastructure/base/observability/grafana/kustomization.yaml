apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: "8.5.2"
    releaseName: grafana
    namespace: observability
    includeCRDs: false
    valuesFile: values.yaml

namespace: observability

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboard-cluster
    files:
      - cluster.json=../../../../../grafana-dashboards/cluster.json
    options:
      annotations:
        grafana_folder: Cluster
