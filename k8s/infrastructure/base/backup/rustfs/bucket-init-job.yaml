apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: rustfs-bucket-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.27.41
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              export AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER"
              export AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD"
              export AWS_DEFAULT_REGION=minio
              for i in $(seq 1 30); do
                if aws s3api list-buckets --endpoint-url http://rustfs.backup.svc.cluster.local:9000 >/dev/null 2>&1; then
                  break
                fi
                echo "RustFS not ready (attempt $i/30); retrying in 2 seconds"
                sleep 2
              done
              aws s3api create-bucket --bucket velero-backups --endpoint-url http://rustfs.backup.svc.cluster.local:9000 2>/dev/null || true
              aws s3api head-bucket --bucket velero-backups --endpoint-url http://rustfs.backup.svc.cluster.local:9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: mc-config
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mc-config
          emptyDir: {}
