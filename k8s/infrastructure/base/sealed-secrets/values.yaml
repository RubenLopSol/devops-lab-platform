fullnameOverride: sealed-secrets
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

metrics:
  serviceMonitor:
    enabled: false
  service:
    port: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL