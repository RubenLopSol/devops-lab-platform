apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets
spec:
  template:
    spec:
      containers:
        - name: controller
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: "1"
