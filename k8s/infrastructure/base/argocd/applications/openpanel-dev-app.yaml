apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpanel-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RubenLopSol/devops-lab-platform.git
    targetRevision: release/main-19f8aad
    path: k8s/apps/overlays/dev/openpanel

  destination:
    server: https://kubernetes.default.svc
    namespace: openpanel

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
