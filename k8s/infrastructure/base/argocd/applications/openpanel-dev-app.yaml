apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpanel-dev
  namespace: argocd
spec:
  project: openpanel

  source:
    repoURL: https://github.com/RubenLopSol/devops-lab-platform.git
    targetRevision: release/platform-55e1367
    path: k8s/apps/overlays/dev/openpanel

  destination:
    server: https://kubernetes.default.svc
    namespace: openpanel

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

