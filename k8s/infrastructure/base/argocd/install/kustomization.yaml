apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml

# ArgoCD is installed from the official Helm chart, but Helm is rendered by
# Kustomize. The GitOps source of truth remains this repository; we do not run
# `helm install` manually.
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.0"
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
