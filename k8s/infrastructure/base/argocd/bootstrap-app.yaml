apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-applications
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RubenLopSol/devops-lab-platform.git
    targetRevision: main
    path: k8s/infrastructure/base/argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
