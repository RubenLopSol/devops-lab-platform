apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/argocd/applications
  - ../../../base/argocd/projects

patches:
  - path: patches/openpanel-app.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: openpanel-dev

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.7.0"
    releaseName: argocd
    namespace: argocd
    valuesFile: ../../../base/argocd/install/values.yaml
    additionalValuesFiles:
      - values.yaml
    includeCRDs: true

labels:
  - pairs:
      environment: prod
      project: openpanel
    includeSelectors: false
