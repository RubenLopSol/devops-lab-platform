apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: openpanel-app
  namespace: openpanel
  labels:
    app: openpanel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openpanel-app
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: openpanel-app
      previewService: openpanel-app-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 600
  template:
    metadata:
      labels:
        app: openpanel-app
    spec:
      containers:
        - name: openpanel-app
          image: ghcr.io/rubenlopsol/devops-lab-app
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
          - configMapRef:
              name: openpanel-app-config
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
