name: Release Platform Revision

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA on main that passed platform validation"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-platform
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate selected platform commit
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA."
            exit 1
          fi

          git fetch origin main --tags
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "The selected commit is not on origin/main."
            exit 1
          }

          SUCCESSFUL_RUNS=$(gh run list \
            --workflow ci-validate.yml \
            --commit "$TARGET_SHA" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')

          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "No successful ci-validate.yml run was found for $TARGET_SHA."
            exit 1
          fi

          SHORT_SHA="${TARGET_SHA:0:7}"
          echo "release_tag=release/platform-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create immutable platform release tag
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ steps.revision.outputs.release_tag }}
        run: |
          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')
          if [ -z "$REMOTE_TAG_SHA" ]; then
            REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
          fi

          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
              echo "Tag ${RELEASE_TAG} already points to a different commit."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to ${TARGET_SHA}."
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Point openpanel-dev at the release
        env:
          RELEASE_TAG: ${{ steps.revision.outputs.release_tag }}
        run: |
          git checkout main
          git pull --ff-only origin main

          sed -i -E \
            "s|(targetRevision:[[:space:]]*)[^[:space:]]+|\\1${RELEASE_TAG}|" \
            k8s/infrastructure/base/argocd/applications/openpanel-dev-app.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/infrastructure/base/argocd/applications/openpanel-dev-app.yaml

          if git diff --staged --quiet; then
            echo "openpanel-dev already points to ${RELEASE_TAG}."
          else
            git commit -m "chore: release platform ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
