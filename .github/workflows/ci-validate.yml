name: Validate platform manifests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: "v5.3.0"
  KUSTOMIZE_SHA256: "3ab32f92360d752a2a53e56be073b649abc1e7351b912c0fb32b960d1def854c"
  KUBECONFORM_VERSION: "v0.6.4"
  KUBECONFORM_SHA256: "2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07"
  KUBERNETES_VERSION: "1.34.0"
  KUBE_LINTER_VERSION: "v0.6.4"
  KUBE_LINTER_SHA256: "39fd93f7339dad1ac3c4b7df75a7684fca0b1e7056d36cc9697d4d1abf795c90"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v6

      - name: Install Kustomize
        run: |
          FILENAME="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          echo "${KUSTOMIZE_SHA256}  ${FILENAME}" | sha256sum --check
          tar xzf "${FILENAME}"
          sudo mv kustomize /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.15.4"
      - name: Install Kubeconform
        run: |
          FILENAME="kubeconform-linux-amd64.tar.gz"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          echo "${KUBECONFORM_SHA256}  ${FILENAME}" | sha256sum --check
          tar xzf "${FILENAME}"
          sudo mv kubeconform /usr/local/bin/

      - name: Install Kube-linter
        run: |
          FILENAME="kube-linter-linux.tar.gz"
          curl -fsSL \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          echo "${KUBE_LINTER_SHA256}  ${FILENAME}" | sha256sum --check
          tar xzf "${FILENAME}"
          sudo mv kube-linter /usr/local/bin/

      - name: Render OpenPanel dev
        run: kustomize build k8s/apps/overlays/dev/openpanel > /tmp/openpanel-dev.yaml

      - name: Render OpenPanel prod
        run: kustomize build k8s/apps/overlays/prod/openpanel > /tmp/openpanel-prod.yaml

      - name: Render ArgoCD install
        run: kustomize build --enable-helm k8s/infrastructure/base/argocd/install > /tmp/argocd-install.yaml

      - name: Render ArgoCD dev overlay
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/argocd > /tmp/argocd-dev.yaml

      - name: Render ArgoCD prod overlay
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/prod/argocd > /tmp/argocd-prod.yaml

      - name: Render Argo Rollouts dev
        run: kustomize build --enable-helm k8s/infrastructure/base/argo-rollouts > /tmp/argo-rollouts-dev.yaml

      - name: Render Argo Rollouts prod
        run: kustomize build --enable-helm k8s/infrastructure/overlays/prod/argo-rollouts > /tmp/argo-rollouts-prod.yaml

      - name: Lint OpenPanel dev manifests
        run: kube-linter lint /tmp/openpanel-dev.yaml --config .kube-linter.yaml

      - name: Lint OpenPanel prod manifests
        run: kube-linter lint /tmp/openpanel-prod.yaml --config .kube-linter.yaml

      - name: Render kube-prometheus-stack dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/kube-prometheus-stack > /tmp/kube-prometheus-stack-dev.yaml

      - name: Render Alertmanager dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/alertmanager > /tmp/alertmanager-dev.yaml

      - name: Render Loki dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/loki > /tmp/loki-dev.yaml

      - name: Render Promtail dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/promtail > /tmp/promtail-dev.yaml

      - name: Render Tempo dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/tempo > /tmp/tempo-dev.yaml

      - name: Render Grafana dev
        run: kustomize build --enable-helm --load-restrictor=LoadRestrictionsNone k8s/infrastructure/overlays/dev/observability/grafana > /tmp/grafana-dev.yaml

      - name: Validate Kubernetes schemas
        run: |
          kubeconform \
            -summary \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            /tmp/openpanel-dev.yaml \
            /tmp/openpanel-prod.yaml \
            /tmp/argocd-install.yaml \
            /tmp/argocd-dev.yaml \
            /tmp/argocd-prod.yaml \
            /tmp/argo-rollouts-dev.yaml \
            /tmp/argo-rollouts-prod.yaml \
            /tmp/kube-prometheus-stack-dev.yaml \
            /tmp/alertmanager-dev.yaml \
            /tmp/loki-dev.yaml \
            /tmp/promtail-dev.yaml \
            /tmp/tempo-dev.yaml \
            /tmp/grafana-dev.yaml
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LOG_OPTS: --no-walk
